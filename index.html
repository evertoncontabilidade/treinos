<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Treino">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="css/style.css">
    <title>Treino do Dia · Entrar</title>
</head>
<body class="centralizado">
    <main class="login-wrap">
        <h1 class="marca">Treino do Dia</h1>
        <form id="form-login" class="login-box">
            <label class="campo">
                <span>Usuário</span>
                <input id="usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="seu nickname" required>
            </label>
            <label class="campo">
                <span>Senha</span>
                <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </label>
            <button id="btn-entrar" type="submit" class="btn-principal">Entrar</button>
        </form>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
