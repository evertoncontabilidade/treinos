<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Treino">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/foto.css">
    <title>Treino do Dia</title>
</head>
<body class="carregando">
    <main class="container-aluno">
        <header class="header-aluno">
            <div class="perfil-info">
                <button type="button" class="foto-perfil" aria-label="Trocar foto do perfil">
                    <img id="foto-aluno" src="icons/avatar.svg" alt="Sua foto">
                </button>
                <input id="input-foto" type="file" accept="image/*" hidden>
                <div class="texto-boas-vindas">
                    <h2 id="nome-aluno">Carregando…</h2>
                    <p id="frase-aluno" class="frase-motivacional"></p>
                </div>
            </div>
            <button id="btn-sair" type="button" class="btn-sair">Sair</button>
        </header>

        <div id="cronometro" class="cronometro-inline" role="timer" aria-live="off">
            <span aria-hidden="true">⏱️</span>
            <span id="cronometro-tempo">00:00</span>
            <button id="btn-parar-timer" type="button" class="btn-parar" aria-label="Parar cronômetro">✕</button>
        </div>

        <p id="status-rede" class="status-rede" role="status" hidden></p>

        <nav id="filtros" class="filtro-treinos" aria-label="Escolha o treino"></nav>
        <section id="lista-exercicios" aria-live="polite"></section>
    </main>
    <dialog id="dialogo-foto" class="dialogo-foto" aria-label="Sua foto de perfil">
        <div class="dialogo-corpo">
            <img id="foto-grande" src="icons/avatar.svg" alt="Sua foto de perfil ampliada">
            <p id="foto-status" class="foto-status" role="status"></p>
            <div class="dialogo-acoes">
                <button id="btn-trocar-foto" type="button" class="btn-principal">Trocar foto</button>
                <button id="btn-fechar-foto" type="button" class="btn-mini">Fechar</button>
            </div>
        </div>
    </dialog>
    <script type="module" src="js/aluno.js"></script>
</body>
</html>
